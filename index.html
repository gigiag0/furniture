<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>평면도 가구 배치 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Floor wood pattern background */
        .wood-floor {
            background-color: #f7d5b8;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(160, 90, 40, 0.15) 30px),
                repeating-linear-gradient(90deg, #fae3d9, #fae3d9 120px, #f3cfb3 121px, #f3cfb3 240px);
            background-size: 240px 30px;
        }

        /* Grid lines overlay clipped inside room polygon */
        .grid-bg {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.12) 1px, transparent 1px);
            clip-path: polygon(
                210px 30px, 420px 30px, 420px 150px, 570px 150px, 570px 360px, 420px 360px, 420px 780px, 30px 780px, 30px 150px, 150px 150px, 150px 90px, 210px 90px, 210px 30px
            );
        }

        /* Custom scrollbar for inventory */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Furniture item in inventory disabled state */
        .item-disabled {
            opacity: 0.35;
            filter: grayscale(80%);
            cursor: not-allowed !important;
        }

        /* Selected furniture outline effect */
        .furniture-selected {
            outline: 2px dashed #2563eb;
            outline-offset: 0px;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900 text-white py-3 px-6 shadow-md flex justify-between items-center z-20">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🛋️</span>
            <h1 class="text-xl font-bold tracking-tight">평면도 가구 배치 게임</h1>
        </div>
        <div class="flex items-center gap-3 text-xs sm:text-sm">
            <button id="toggle-grid-btn" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg transition text-slate-200">
                격자 숨기기
            </button>
            <button id="save-image-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-lg font-medium transition shadow-sm">
                🖼️ 이미지 저장
            </button>
            <button id="reset-all-btn" class="bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-1.5 rounded-lg font-medium transition shadow-sm">
                전체 초기화
            </button>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden max-w-[1400px] w-full mx-auto p-4 gap-4">
        
        <!-- Left Sidebar: Furniture List / Inventory -->
        <aside class="w-full md:w-80 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex flex-col justify-between h-[300px] md:h-auto">
            <div>
                <div class="flex justify-between items-center pb-3 mb-3 border-b border-slate-100">
                    <h2 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                        <span>📦</span> 가구 목록
                        <span class="text-xs font-normal text-slate-500">(1개씩 사용 가능)</span>
                    </h2>
                    <span id="placed-count" class="text-xs font-bold bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full">
                        0 / 6 배치됨
                    </span>
                </div>

                <!-- Inventory Items Container -->
                <div id="inventory-list" class="space-y-3 overflow-y-auto max-h-[calc(100vh-250px)] pr-1 custom-scroll">
                    <!-- Items generated by JavaScript -->
                </div>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-100 text-xs text-slate-400 text-center">
                가구 배치 후 클릭하면 회전 및 회수가 가능합니다.
            </div>
        </aside>

        <!-- Right Area: Room Floor Plan Viewport -->
        <section class="flex-1 bg-slate-200 rounded-2xl border border-slate-300 p-4 sm:p-6 flex flex-col items-center justify-center overflow-auto relative">
            
            <!-- Canvas Container for Room & Furniture (660px x 840px) -->
            <div id="room-canvas" class="relative bg-white shadow-xl rounded-lg overflow-hidden transition-all" style="width: 600px; height: 840px;">
                
                <!-- SVG Floor Plan Background with Walls, Windows, Doors, Outlets -->
                <svg id="floor-svg" class="absolute inset-0 w-full h-full pointer-events-none z-0" viewBox="0 0 600 840">
                    <defs>
                        <pattern id="woodPattern" width="240" height="30" patternUnits="userSpaceOnUse">
                            <rect width="240" height="30" fill="#fde3d0"/>
                        </pattern>
                    </defs>

                    <!-- Room Floor Polygon -->
                    <polygon points="
                        210,30 420,30 420,150 570,150 570,360 420,360 420,780 30,780 30,150 150,150 150,90 210,90 210,30
                    " fill="url(#woodPattern)" stroke="#000000" stroke-width="5" stroke-linejoin="miter"/>

                    <!-- Interior Wall Lines -->
                    <polygon points="
                        210,30 420,30 420,150 570,150 570,360 420,360 420,780 30,780 30,150 150,150 150,90 210,90 210,30
                    " fill="none" stroke="#222222" stroke-width="2.5"/>

                    <!-- WINDOW 1: Left Window -->
                    <g id="window-left">
                        <rect x="18" y="360" width="14" height="210" fill="#ccebfb" stroke="#000000" stroke-width="2"/>
                        <line x1="25" y1="360" x2="25" y2="570" stroke="#68b9eb" stroke-width="3"/>
                        <rect x="15" y="358" width="20" height="4" fill="#000000"/>
                        <rect x="15" y="568" width="20" height="4" fill="#000000"/>
                    </g>

                    <!-- WINDOW 2: Bottom Window -->
                    <g id="window-bottom">
                        <rect x="210" y="776" width="180" height="14" fill="#ccebfb" stroke="#000000" stroke-width="2"/>
                        <line x1="210" y1="783" x2="390" y2="783" stroke="#68b9eb" stroke-width="3"/>
                        <rect x="208" y="773" width="4" height="20" fill="#000000"/>
                        <rect x="388" y="773" width="4" height="20" fill="#000000"/>
                    </g>

                    <!-- DOOR: Bottom Right Door Arc (Shifted up 30px) -->
                    <g id="door-bottom-right" transform="translate(2, 0)">
                        <path d="M 420 750 L 330 750 A 90 90 0 0 1 420 660 Z" fill="#bde5fb" opacity="0.85" stroke="#52a5e2" stroke-width="2"/>
                    </g>

                    <!-- OUTLETS: Orange Squares with Dark Border -->
                    <rect x="412" y="100" width="16" height="16" fill="#f97316" stroke="#c2410c" stroke-width="1.5" rx="1"/>
                    <rect x="450" y="352" width="16" height="16" fill="#f97316" stroke="#c2410c" stroke-width="1.5" rx="1"/>
                    <rect x="412" y="380" width="16" height="16" fill="#f97316" stroke="#c2410c" stroke-width="1.5" rx="1"/>
                </svg>

                <!-- Grid Overlay Layer Clipped Inside Room Polygon -->
                <div id="grid-layer" class="absolute inset-0 grid-bg pointer-events-none z-10"></div>

                <!-- Placed Furniture Layer Container -->
                <div id="placed-furniture-layer" class="absolute inset-0 z-20 overflow-hidden"></div>

                <!-- Floating Toolbar for Selected Furniture -->
                <div id="furniture-toolbar" class="hidden absolute z-30 bg-slate-900/90 text-white text-xs py-1.5 px-3 rounded-full shadow-lg backdrop-blur-sm flex items-center gap-2 transform -translate-x-1/2 -translate-y-full transition-all">
                    <button id="rotate-btn" class="hover:text-blue-300 flex items-center gap-1 font-medium">
                        🔄 회전
                    </button>
                    <span class="text-slate-600">|</span>
                    <button id="remove-btn" class="hover:text-rose-300 flex items-center gap-1 font-medium text-rose-400">
                        🗑️ 회수
                    </button>
                </div>

            </div>
        </section>
    </main>

    <!-- Application Logic Script -->
    <script>
        // Grid configuration (30px = 1 unit)
        const GRID_SIZE = 30;

        // Furniture Dataset (6 items - exact multiples of 30px for clean snapping to floor bounds)
        const FURNITURE_DATA = [
            {
                id: 'sofa',
                name: '쇼파',
                width: 240,  
                height: 120, 
                gridWidth: 8,
                gridHeight: 4,
                svg: `
                    <svg viewBox="0 0 240 120" width="100%" height="100%">
                        <rect x="0" y="0" width="240" height="60" fill="#bce2f7" stroke="#000000" stroke-width="2.5" rx="2"/>
                        <rect x="4" y="4" width="232" height="14" fill="#fde8ad" stroke="#000000" stroke-width="2" rx="3"/>
                        <rect x="4" y="20" width="232" height="36" fill="#fde8ad" stroke="#000000" stroke-width="2" rx="4"/>
                        <text x="120" y="44" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="20" fill="#000000" text-anchor="middle">쇼파</text>
                        <rect x="0" y="60" width="90" height="60" fill="#bce2f7" stroke="#000000" stroke-width="2.5" rx="2"/>
                        <rect x="4" y="64" width="28" height="52" fill="#fde8ad" stroke="#000000" stroke-width="2" rx="3"/>
                        <rect x="36" y="64" width="50" height="52" fill="#fde8ad" stroke="#000000" stroke-width="2" rx="3"/>
                    </svg>
                `
            },
            {
                id: 'bed',
                name: '침대',
                width: 120,  
                height: 120,
                gridWidth: 4,
                gridHeight: 4,
                svg: `
                    <svg viewBox="0 0 120 120" width="100%" height="100%">
                        <rect x="0" y="0" width="120" height="120" fill="#bce2f7" stroke="#000000" stroke-width="2.5" rx="3"/>
                        <rect x="40" y="6" width="40" height="18" fill="#fde8ad" stroke="#000000" stroke-width="1.5" rx="3"/>
                        <rect x="6" y="28" width="108" height="86" fill="#fde8ad" stroke="#000000" stroke-width="2.5" rx="6"/>
                        <text x="60" y="80" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="22" fill="#000000" text-anchor="middle">침대</text>
                    </svg>
                `
            },
            {
                id: 'vanity',
                name: '화장대',
                width: 180,  
                height: 120,
                gridWidth: 6,
                gridHeight: 4,
                svg: `
                    <svg viewBox="0 0 180 120" width="100%" height="100%">
                        <rect x="0" y="0" width="180" height="60" fill="#bce2f7" stroke="#000000" stroke-width="2.5" rx="1"/>
                        <text x="90" y="38" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="20" fill="#000000" text-anchor="middle">화장대</text>
                        <rect x="66" y="60" width="48" height="60" fill="#bce2f7" stroke="#000000" stroke-width="2.5"/>
                        <rect x="72" y="66" width="36" height="48" fill="#fde8ad" stroke="#000000" stroke-width="1.5"/>
                        <text x="90" y="96" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="16" fill="#000000" text-anchor="middle">의자</text>
                    </svg>
                `
            },
            {
                id: 'bookshelf',
                name: '책장 세트',
                width: 120,  
                height: 210, 
                gridWidth: 4,
                gridHeight: 7,
                svg: `
                    <svg viewBox="0 0 120 210" width="100%" height="100%">
                        <rect x="0" y="0" width="120" height="60" fill="#bce2f7" stroke="#000000" stroke-width="2.5"/>
                        <text x="60" y="38" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="20" fill="#000000" text-anchor="middle">책장</text>
                        <rect x="60" y="60" width="60" height="150" fill="#bce2f7" stroke="#000000" stroke-width="2.5"/>
                        <text x="90" y="140" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="20" fill="#000000" text-anchor="middle">책상</text>
                        <rect x="0" y="60" width="60" height="60" fill="#bce2f7" stroke="#000000" stroke-width="2.5"/>
                        <rect x="6" y="66" width="48" height="48" fill="#fde8ad" stroke="#000000" stroke-width="1.5"/>
                        <text x="30" y="96" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="16" fill="#000000" text-anchor="middle">의자</text>
                    </svg>
                `
            },
            {
                id: 'tv_stand',
                name: 'TV선반',
                width: 180,  
                height: 60,
                gridWidth: 6,
                gridHeight: 2,
                svg: `
                    <svg viewBox="0 0 180 60" width="100%" height="100%">
                        <rect x="0" y="0" width="180" height="60" fill="#fde8ad" stroke="#000000" stroke-width="2.5" rx="2"/>
                        <text x="90" y="28" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="20" fill="#000000" text-anchor="middle">TV선반</text>
                        <rect x="25" y="36" width="130" height="16" fill="#808080" stroke="#000000" stroke-width="1.5"/>
                    </svg>
                `
            },
            {
                id: 'hanger',
                name: '행거',
                width: 180,  
                height: 180, 
                gridWidth: 6,
                gridHeight: 6,
                svg: `
                    <svg viewBox="0 0 180 180" width="100%" height="100%">
                        <rect x="120" y="0" width="60" height="60" fill="#fde8ad" stroke="#000000" stroke-width="2.5"/>
                        <rect x="0" y="60" width="180" height="60" fill="#fde8ad" stroke="#000000" stroke-width="2.5"/>
                        <rect x="0" y="83" width="180" height="14" fill="#bce2f7" stroke="#000000" stroke-width="1.5"/>
                        <text x="90" y="95" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="18" fill="#000000" text-anchor="middle">행거</text>
                        <rect x="0" y="120" width="60" height="60" fill="#fde8ad" stroke="#000000" stroke-width="2.5"/>
                    </svg>
                `
            }
        ];

        // State Tracking
        const placedFurnitureState = {}; 
        let selectedFurnitureId = null;
        let activeDragId = null;
        let dragOffset = { x: 0, y: 0 };

        // DOM Elements
        const inventoryListEl = document.getElementById('inventory-list');
        const placedFurnitureLayer = document.getElementById('placed-furniture-layer');
        const placedCountEl = document.getElementById('placed-count');
        const roomCanvas = document.getElementById('room-canvas');
        const furnitureToolbar = document.getElementById('furniture-toolbar');
        const rotateBtn = document.getElementById('rotate-btn');
        const removeBtn = document.getElementById('remove-btn');
        const resetAllBtn = document.getElementById('reset-all-btn');
        const saveImageBtn = document.getElementById('save-image-btn');
        const toggleGridBtn = document.getElementById('toggle-grid-btn');
        const gridLayer = document.getElementById('grid-layer');

        function initApp() {
            renderInventory();
            renderPlacedFurniture();
            updatePlacedCount();
            setupEventListeners();
        }

        // Render Furniture Inventory List
        function renderInventory() {
            inventoryListEl.innerHTML = '';

            FURNITURE_DATA.forEach(item => {
                const isPlaced = !!placedFurnitureState[item.id];
                
                const card = document.createElement('div');
                card.id = `inv-item-${item.id}`;
                card.className = `p-3 rounded-xl border bg-slate-50 transition-all flex items-center gap-3 ${
                    isPlaced ? 'item-disabled border-slate-200' : 'hover:border-blue-400 hover:shadow-md cursor-grab border-slate-200 bg-white'
                }`;
                card.draggable = !isPlaced;

                const previewBox = document.createElement('div');
                previewBox.className = 'w-20 h-20 bg-amber-50/50 rounded-lg border border-slate-200 p-1.5 flex items-center justify-center shrink-0';
                previewBox.innerHTML = item.svg;

                const infoBox = document.createElement('div');
                infoBox.className = 'flex-1 min-w-0';
                infoBox.innerHTML = `
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-slate-800 text-sm">${item.name}</h3>
                        ${isPlaced ? '<span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded">배치됨</span>' : ''}
                    </div>
                `;

                card.appendChild(previewBox);
                card.appendChild(infoBox);

                card.addEventListener('dragstart', (e) => {
                    if (isPlaced) return e.preventDefault();
                    e.dataTransfer.setData('text/plain', item.id);
                    card.classList.add('opacity-50');
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('opacity-50');
                });

                card.addEventListener('click', () => {
                    if (!isPlaced) {
                        const defaultPos = findValidSpawnPos(item.id, 0);
                        placeFurnitureOnCanvas(item.id, defaultPos.x, defaultPos.y);
                    }
                });

                inventoryListEl.appendChild(card);
            });
        }

        // Allow furniture positioning up to the bottom wall start (y <= 780)
        function isFurniturePosValid(id, posX, posY, rotation) {
            const data = FURNITURE_DATA.find(f => f.id === id);
            if (!data) return false;

            const rot = (rotation || 0) % 360;
            const isRotated90 = (rot === 90 || rot === 270);

            const effW = isRotated90 ? data.height : data.width;
            const effH = isRotated90 ? data.width : data.height;

            const visualX = posX + (data.width - effW) / 2;
            const visualY = posY + (data.height - effH) / 2;

            return (visualX >= 0 && visualX + effW <= 660 && visualY >= 0 && visualY + effH <= 780);
        }

        // Helper to find initial valid placement inside the canvas
        function findValidSpawnPos(id, rotation) {
            const rot = rotation || 0;
            const data = FURNITURE_DATA.find(f => f.id === id);
            if (!data) return { x: 210, y: 150 };

            const isRotated90 = ((rot % 360) === 90 || (rot % 360) === 270);
            const effW = isRotated90 ? data.height : data.width;
            const effH = isRotated90 ? data.width : data.height;

            const posX = 210 - (data.width - effW) / 2;
            const posY = 150 - (data.height - effH) / 2;

            if (isFurniturePosValid(id, posX, posY, rot)) {
                return { x: posX, y: posY };
            }
            return { x: 30, y: 30 };
        }

        function placeFurnitureOnCanvas(id, posX, posY) {
            const data = FURNITURE_DATA.find(f => f.id === id);
            if (!data) return;

            let snappedX = Math.round(posX / GRID_SIZE) * GRID_SIZE;
            let snappedY = Math.round(posY / GRID_SIZE) * GRID_SIZE;

            if (!isFurniturePosValid(id, snappedX, snappedY, 0)) {
                const spawnPos = findValidSpawnPos(id, 0);
                snappedX = spawnPos.x;
                snappedY = spawnPos.y;
            }

            placedFurnitureState[id] = {
                x: snappedX,
                y: snappedY,
                rotation: 0
            };

            renderPlacedFurniture();
            renderInventory();
            updatePlacedCount();
            selectFurniture(id);
        }

        // Render placed furniture layer onto canvas
        function renderPlacedFurniture() {
            placedFurnitureLayer.innerHTML = '';

            Object.keys(placedFurnitureState).forEach(id => {
                const state = placedFurnitureState[id];
                const data = FURNITURE_DATA.find(f => f.id === id);
                if (!data) return;

                const isSelected = (selectedFurnitureId === id);

                const el = document.createElement('div');
                el.className = `absolute cursor-grab active:cursor-grabbing transition-transform ${isSelected ? 'furniture-selected z-30' : 'z-20'}`;
                el.style.width = `${data.width}px`;
                el.style.height = `${data.height}px`;
                el.style.left = `${state.x}px`;
                el.style.top = `${state.y}px`;
                el.style.transform = `rotate(${state.rotation || 0}deg)`;
                el.style.transformOrigin = 'center center';
                el.innerHTML = data.svg;

                el.addEventListener('mousedown', (e) => startDragging(e, id));
                el.addEventListener('touchstart', (e) => startDragging(e, id), { passive: false });

                placedFurnitureLayer.appendChild(el);
            });

            updateToolbarPosition();
        }

        function selectFurniture(id) {
            selectedFurnitureId = id;
            renderPlacedFurniture();
        }

        function rotateSelectedFurniture() {
            if (!selectedFurnitureId || !placedFurnitureState[selectedFurnitureId]) return;
            const currentRot = placedFurnitureState[selectedFurnitureId].rotation || 0;
            const nextRot = (currentRot + 90) % 360;

            const curX = placedFurnitureState[selectedFurnitureId].x;
            const curY = placedFurnitureState[selectedFurnitureId].y;

            if (isFurniturePosValid(selectedFurnitureId, curX, curY, nextRot)) {
                placedFurnitureState[selectedFurnitureId].rotation = nextRot;
            } else {
                let shifted = false;
                for (let dy = -60; dy <= 60; dy += 30) {
                    for (let dx = -60; dx <= 60; dx += 30) {
                        if (isFurniturePosValid(selectedFurnitureId, curX + dx, curY + dy, nextRot)) {
                            placedFurnitureState[selectedFurnitureId].x = curX + dx;
                            placedFurnitureState[selectedFurnitureId].y = curY + dy;
                            placedFurnitureState[selectedFurnitureId].rotation = nextRot;
                            shifted = true;
                            break;
                        }
                    }
                    if (shifted) break;
                }
            }
            renderPlacedFurniture();
        }

        function removeSelectedFurniture() {
            if (!selectedFurnitureId) return;
            delete placedFurnitureState[selectedFurnitureId];
            selectedFurnitureId = null;
            renderPlacedFurniture();
            renderInventory();
            updatePlacedCount();
        }

        function updateToolbarPosition() {
            if (!selectedFurnitureId || !placedFurnitureState[selectedFurnitureId]) {
                furnitureToolbar.classList.add('hidden');
                return;
            }

            const state = placedFurnitureState[selectedFurnitureId];
            const data = FURNITURE_DATA.find(f => f.id === selectedFurnitureId);
            if (!data) return;

            const rot = (state.rotation || 0) % 360;
            const isRotated90 = (rot === 90 || rot === 270);
            
            const effHeight = isRotated90 ? data.width : data.height;
            const offsetY = (data.height - effHeight) / 2;
            const visualTop = state.y + offsetY;

            furnitureToolbar.classList.remove('hidden');
            furnitureToolbar.style.left = `${state.x + data.width / 2}px`;
            furnitureToolbar.style.top = `${Math.max(20, visualTop - 12)}px`;
        }

        function updatePlacedCount() {
            const count = Object.keys(placedFurnitureState).length;
            placedCountEl.textContent = `${count} / ${FURNITURE_DATA.length} 배치됨`;
        }

        // 현재 평면도만 PNG 이미지로 저장
        async function saveRoomAsImage() {
            if (typeof html2canvas === 'undefined') {
                alert('이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
                return;
            }

            // 저장할 때는 선택 표시와 회전/회수 툴바를 잠시 숨김
            const selectedIdBeforeSave = selectedFurnitureId;
            const toolbarWasHidden = furnitureToolbar.classList.contains('hidden');
            selectedFurnitureId = null;
            furnitureToolbar.classList.add('hidden');
            renderPlacedFurniture();

            saveImageBtn.disabled = true;
            const originalText = saveImageBtn.textContent;
            saveImageBtn.textContent = '⏳ 저장 중...';

            try {
                const canvas = await html2canvas(roomCanvas, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    useCORS: true,
                    logging: false
                });

                const link = document.createElement('a');
                const now = new Date();
                const stamp =
                    `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_` +
                    `${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
                link.download = `평면도_가구배치_${stamp}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (error) {
                console.error('이미지 저장 실패:', error);
                alert('이미지 저장에 실패했습니다. 다시 시도해 주세요.');
            } finally {
                selectedFurnitureId = selectedIdBeforeSave;
                renderPlacedFurniture();
                if (toolbarWasHidden) {
                    furnitureToolbar.classList.add('hidden');
                }
                saveImageBtn.disabled = false;
                saveImageBtn.textContent = originalText;
            }
        }

        function startDragging(e, id) {
            e.stopPropagation();
            selectFurniture(id);

            activeDragId = id;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const rect = roomCanvas.getBoundingClientRect();
            const state = placedFurnitureState[id];

            dragOffset.x = (clientX - rect.left) - state.x;
            dragOffset.y = (clientY - rect.top) - state.y;

            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('touchmove', onDragMove, { passive: false });
            document.addEventListener('touchend', onDragEnd);
        }

        function onDragMove(e) {
            if (!activeDragId) return;
            e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const rect = roomCanvas.getBoundingClientRect();
            let rawX = (clientX - rect.left) - dragOffset.x;
            let rawY = (clientY - rect.top) - dragOffset.y;

            const state = placedFurnitureState[activeDragId];
            const rot = state.rotation || 0;

            const snappedX = Math.round(rawX / GRID_SIZE) * GRID_SIZE;
            const snappedY = Math.round(rawY / GRID_SIZE) * GRID_SIZE;

            // Enforce canvas boundaries
            if (isFurniturePosValid(activeDragId, snappedX, snappedY, rot)) {
                placedFurnitureState[activeDragId].x = snappedX;
                placedFurnitureState[activeDragId].y = snappedY;
            } else if (isFurniturePosValid(activeDragId, snappedX, state.y, rot)) {
                placedFurnitureState[activeDragId].x = snappedX;
            } else if (isFurniturePosValid(activeDragId, state.x, snappedY, rot)) {
                placedFurnitureState[activeDragId].y = snappedY;
            }

            renderPlacedFurniture();
        }

        function onDragEnd() {
            activeDragId = null;
            document.removeEventListener('mousemove', onDragMove);
            document.removeEventListener('mouseup', onDragEnd);
            document.removeEventListener('touchmove', onDragMove);
            document.removeEventListener('touchend', onDragEnd);
        }

        function setupEventListeners() {
            roomCanvas.addEventListener('dragover', (e) => e.preventDefault());
            roomCanvas.addEventListener('drop', (e) => {
                e.preventDefault();
                const id = e.dataTransfer.getData('text/plain');
                if (!id || placedFurnitureState[id]) return;

                const rect = roomCanvas.getBoundingClientRect();
                const data = FURNITURE_DATA.find(f => f.id === id);
                
                const dropX = (e.clientX - rect.left) - (data ? data.width / 2 : 0);
                const dropY = (e.clientY - rect.top) - (data ? data.height / 2 : 0);

                placeFurnitureOnCanvas(id, dropX, dropY);
            });

            roomCanvas.addEventListener('click', (e) => {
                if (e.target === roomCanvas || e.target.id === 'grid-layer' || e.target.tagName === 'polygon' || e.target.tagName === 'svg') {
                    selectedFurnitureId = null;
                    renderPlacedFurniture();
                }
            });

            rotateBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                rotateSelectedFurniture();
            });

            removeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                removeSelectedFurniture();
            });

            resetAllBtn.addEventListener('click', () => {
                Object.keys(placedFurnitureState).forEach(key => delete placedFurnitureState[key]);
                selectedFurnitureId = null;
                renderPlacedFurniture();
                renderInventory();
                updatePlacedCount();
            });

            saveImageBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                saveRoomAsImage();
            });

            let gridVisible = true;
            toggleGridBtn.addEventListener('click', () => {
                gridVisible = !gridVisible;
                gridLayer.style.display = gridVisible ? 'block' : 'none';
                toggleGridBtn.textContent = gridVisible ? '격자 숨기기' : '격자 보기';
            });
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
